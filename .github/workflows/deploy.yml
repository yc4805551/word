name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          # 安全约束：禁止向构建环境注入任何 *_API_KEY。
          # Vite 会把 VITE_* 明文内联进前端 bundle，公开站点等同密钥泄露。
          # 密钥只能存在于服务端（server/kwiki-api.mjs 读取 ~/.gemini/.env）
          # 或用户浏览器 localStorage（系统设置中自行填写）。
          VITE_OPENAI_ENDPOINT: ${{ secrets.VITE_OPENAI_ENDPOINT }}
          VITE_OPENAI_MODEL: ${{ secrets.VITE_OPENAI_MODEL }}
          VITE_DEEPSEEK_ENDPOINT: ${{ secrets.VITE_DEEPSEEK_ENDPOINT }}
          VITE_DEEPSEEK_MODEL: ${{ secrets.VITE_DEEPSEEK_MODEL }}
          VITE_ALI_ENDPOINT: ${{ secrets.VITE_ALI_ENDPOINT }}
          VITE_ALI_MODEL: ${{ secrets.VITE_ALI_MODEL }}
          VITE_DOUBAO_ENDPOINT: ${{ secrets.VITE_DOUBAO_ENDPOINT }}
          VITE_DOUBAO_MODEL: ${{ secrets.VITE_DOUBAO_MODEL }}
          VITE_DEPOCR_ENDPOINT: ${{ secrets.VITE_DEPOCR_ENDPOINT }}
          VITE_DEPOCR_MODEL: ${{ secrets.VITE_DEPOCR_MODEL }}
          VITE_KWIKI_API_BASE_URL: https://mac-agent.tail36f59d.ts.net

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
